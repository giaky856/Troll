version: "3.7"

services:
windows:
image: dockurr/windows
container_name: windows
privileged: true
restart: unless-stopped
devices:
- /dev/kvm
- /dev/net/tun
cap_add:
- NET_ADMIN
ports:
- "8007:8006"
- "8008:8006"
environment:
USERNAME: "Code-chillmusic"
PASSWORD: "admin123"
VERSION: "10"
RAM_SIZE: "32G"
CPU_CORES: "4"
DISK_SIZE: "100G"
DISK2_SIZE: "80G"
SCREEN_RESOLUTION: "1280x720"
REBUILD: "false"
